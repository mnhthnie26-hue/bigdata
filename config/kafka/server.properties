# Kafka Server Configuration for Livestream Analytics
# ===================================================

# Broker Basics
broker.id=1
listeners=PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
advertised.listeners=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

# Zookeeper
zookeeper.connect=zookeeper:2181
zookeeper.connection.timeout.ms=18000

# Log Configuration
log.dirs=/var/lib/kafka/data
num.partitions=12
default.replication.factor=1
min.insync.replicas=1

# Topic Configuration
auto.create.topics.enable=true
auto.leader.rebalance.enable=true
leader.imbalance.check.interval.seconds=300
leader.imbalance.per.broker.percentage=10

# Log Retention
log.retention.hours=168
log.retention.bytes=-1
log.segment.bytes=1073741824
log.segment.ms=604800000
log.cleanup.policy=delete
log.cleaner.enable=true

# Flush Settings
flush.messages=10000
flush.ms=1000

# Socket Server
num.network.threads=8
num.io.threads=16
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# Replication
replica.lag.time.max.ms=30000
replica.socket.timeout.ms=30000
replica.socket.receive.buffer.bytes=65536
replica.fetch.max.bytes=1048576
replica.fetch.wait.max.ms=500
replica.fetch.min.bytes=1

# Controller
controller.socket.timeout.ms=30000
controller.message.queue.size=10

# Group Coordinator
group.min.session.timeout.ms=6000
group.max.session.timeout.ms=300000
group.initial.rebalance.delay.ms=0

# Metrics
metric.reporters=
metrics.num.samples=2
metrics.sample.window.ms=30000
metrics.recording.level=INFO

# JMX
jmx.port=9101
com.sun.management.jmxremote=true
com.sun.management.jmxremote.authenticate=false
com.sun.management.jmxremote.ssl=false
com.sun.management.jmxremote.rmi.port=9101

# Quota
quota.window.size.seconds=1
quota.window.num=10

# Transaction
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
transaction.max.timeout.ms=900000
transaction.abort.timed.out.transaction.cleanup.interval.ms=60000

# Log Cleaner
log.cleaner.threads=2
log.cleaner.io.max.bytes.per.second=1.7976931348623157E308
log.cleaner.dedupe.buffer.size=134217728
log.cleaner.io.buffer.size=524288
log.cleaner.io.buffer.load.factor=0.9
log.cleaner.backoff.ms=15000
log.cleaner.min.cleanable.ratio=0.5
log.cleaner.enable=true

# Compression
compression.type=snappy

# Security (disabled for local dev)
# ssl.keystore.location=
# ssl.keystore.password=
# ssl.key.password=
# ssl.truststore.location=
# ssl.truststore.password=

# Rack Awareness (for multi-dc)
# broker.rack=